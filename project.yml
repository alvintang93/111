# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# Before running on your watch, change the three values marked CHANGE ME.
name: Margin
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID_PREFIX: com.example.margin      # CHANGE ME (reverse-DNS you own)
    APP_GROUP_ID: group.com.example.margin    # CHANGE ME (must start with "group.")
    DEVELOPMENT_TEAM: ""                      # CHANGE ME (Xcode > Settings > Accounts)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "4"
packages:
  MarginCore:
    path: MarginCore
targets:
  Margin:
    type: application
    platform: watchOS
    sources:
      - path: MarginWatch/App
      - path: MarginWatch/Shared
    dependencies:
      - package: MarginCore
      - target: MarginWidgets
    settings:
      base:
        PRODUCT_NAME: Margin
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MarginWatch/Support/App-Info.plist
      properties:
        CFBundleDisplayName: Margin
        WKApplication: true
        WKWatchOnly: true
        MarginAppGroupID: $(APP_GROUP_ID)
        NSHealthShareUsageDescription: Margin reads heart rate, HRV, resting heart rate, respiratory rate, wrist temperature and sleep to compute recovery and training load. All processing happens on your watch.
    entitlements:
      path: MarginWatch/Support/Margin.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
  MarginWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: MarginWatch/Widgets
      - path: MarginWatch/Shared
    dependencies:
      - package: MarginCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: MarginWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchkitapp.widgets
        SKIP_INSTALL: "YES"
    info:
      path: MarginWatch/Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Margin
        MarginAppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MarginWatch/Support/MarginWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
schemes:
  Margin:
    build:
      targets:
        Margin: all
    run:
      config: Debug
    archive:
      config: Release
